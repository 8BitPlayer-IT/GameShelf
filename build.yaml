targets:
  $default:
    builders:
      drift_dev:
        options:
          # `dart run drift_dev make-migrations` legge questa configurazione:
          # salva lo schema corrente in drift_schemas/ e genera i test di migrazione
          # in test/drift/. Gli schemi vanno committati: sono il riferimento per
          # migrare senza perdere i dati già inseriti sul telefono.
          databases:
            gameshelf: lib/data/database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
